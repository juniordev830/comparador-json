name: Validar PHP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Analisar sintaxe e testar
        run: docker run --rm -v "$PWD:/work" -w /work php:8.3-cli sh -c 'php -l main.php && php main.php --self-test'
      - name: Validar resumo e código de diferença na CLI
        run: |
          docker run --rm -v "$PWD:/work" -w /work php:8.3-cli php main.php --resumo examples/antes.json examples/depois.json | grep -F '"iguais": false'
          set +e
          docker run --rm -v "$PWD:/work" -w /work php:8.3-cli php main.php --falhar-se-diferente examples/antes.json examples/depois.json >/dev/null
          status=$?
          set -e
          test "$status" -eq 1
